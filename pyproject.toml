[tool.poetry]
name = "chapel-printings"
version = "0.0.0"
description = "stl print run manager tool"
authors = ["Stuart Stanley <stu00@mac.com>"]
readme = "README.md"
packages = [
    { include = "chapel_printings" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4"
solidpython2 = "^2.1.3"
click = "^8.3.1"
yamale = "^6.1.0"

#[tool.poetry.scripts]
# braille-record-labler = "braille_record_labler.labler_cli:braille_record_labler"
munch = "^4.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=1.7.0", "poetry-dynamic-versioning>=1.1.0"]
build-backend = "poetry.core.masonry.api"